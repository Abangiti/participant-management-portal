<nav class="navbar navbar-dark shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" routerLink="/participants">
      Participant Management Portal
    </a>

    <button
      type="button"
      class="btn btn-outline-light"
      (click)="cancel()"
    >
      Back to Participants
    </button>
  </div>
</nav>

<main class="container p-4">
  <section class="card participant-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold mb-2">
  {{ isEditMode ? 'Edit Participant' : 'Register Participant' }}
</h1>
      <p class="text-muted mb-4">
        Enter the details of the new participant bank.
      </p>

      <form (ngSubmit)="save()" #participantForm="ngForm">
        <div class="mb-3">
          <label for="name" class="form-label">Bank Name</label>
          <input
            id="name"
            type="text"
            class="form-control"
            name="name"
            [(ngModel)]="name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="bic" class="form-label">BIC</label>
          <input
            id="bic"
            type="text"
            class="form-control"
            name="bic"
            [(ngModel)]="bic"
            required
          />
        </div>

        <div class="mb-3">
          <label for="shortName" class="form-label">Short Name</label>
          <input
            id="shortName"
            type="text"
            class="form-control"
            name="shortName"
            [(ngModel)]="shortName"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="email"
            required
            email
          />
        </div>

        <div class="mb-3">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input
            id="phoneNumber"
            type="tel"
            class="form-control"
            name="phoneNumber"
            [(ngModel)]="phoneNumber"
            required
          />
        </div>

        <div class="mb-4">
          <label for="status" class="form-label">Status</label>
          <select
            id="status"
            class="form-select"
            name="status"
            [(ngModel)]="status"
            required
          >
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="participantForm.invalid"
          >
           {{ isEditMode ? 'Save Changes' : 'Save Participant' }}
          </button>

          <button
            type="button"
            class="btn btn-outline-light"
            (click)="cancel()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
